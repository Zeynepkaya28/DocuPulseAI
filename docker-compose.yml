# Local development only. Production uses Neo4j AuraDB + Supabase (see docs/deploy.md).
# `supabase start` runs Postgres/Auth/Storage/Realtime; this file only adds Neo4j.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/docupulse-dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "docupulse-dev", "RETURN 1"]
      interval: 10s
      retries: 10

  # ── Optional: original architecture, for a local demo only ──
  # docker compose --profile showcase up -d
  kafka:
    profiles: ["showcase"]
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  qdrant:
    profiles: ["showcase"]
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"

volumes:
  neo4j-data:
