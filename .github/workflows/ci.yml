name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w packages/contracts   # generated TS/Pydantic are up to date
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    name: API · ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Unit tests; the integration module skips itself without a local stack (it runs in the e2e job).
      - run: pytest -q
        env:
          LLM_PROVIDER: fake

  e2e:
    name: E2E · Supabase + Neo4j + Playwright (HIG checks)
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      neo4j:
        image: neo4j:5.26-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/docupulse-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: python -m venv apps/api/.venv && apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - run: supabase test db              # pgTAP RLS tests
      - run: node scripts/setup-local-env.mjs
      - name: API integration tests (pipeline, GraphRAG, visibility)
        working-directory: apps/api
        env:
          LLM_PROVIDER: fake
        run: .venv/bin/python -m pytest -q
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright (375px / 1920px, light + dark)
        working-directory: apps/web
        env:
          LLM_PROVIDER: fake
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/e2e/screenshots
